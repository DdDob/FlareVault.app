<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Legacy Vault flow</title>
  <desc id="d">Connect, set the plan, deposit into the Legacy Vault V2 contract, then check in. If a check-in is missed, beneficiaries claim their share from the contract.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ff4d0d"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff6a2c"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f2f2f4}
    .title{font-size:22px;font-weight:700}
    .num{font-size:13px;font-weight:700;fill:#ff9a1f;letter-spacing:1px}
    .h{font-size:17px;font-weight:700}
    .s{font-size:13px;fill:#a5a5ad}
    .lbl{font-size:12px;fill:#8a8a93}
    .box{fill:#17171b;stroke:#2c2c33;stroke-width:1.5}
  </style>

  <rect width="960" height="560" rx="20" fill="#0d0d0f"/>
  <rect x="0.75" y="0.75" width="958.5" height="558.5" rx="19.5" fill="none" stroke="#26262c" stroke-width="1.5"/>

  <text x="480" y="46" text-anchor="middle" class="title">How Legacy Vault works</text>

  <!-- Step boxes -->
  <rect class="box" x="40"  y="80" width="190" height="96" rx="14"/>
  <rect class="box" x="270" y="80" width="190" height="96" rx="14"/>
  <rect class="box" x="500" y="80" width="190" height="96" rx="14"/>
  <rect class="box" x="730" y="80" width="190" height="96" rx="14"/>

  <text x="60"  y="108" class="num">STEP 1</text>
  <text x="60"  y="134" class="h">Connect</text>
  <text x="60"  y="156" class="s">Your own wallet</text>

  <text x="290" y="108" class="num">STEP 2</text>
  <text x="290" y="134" class="h">Set the plan</text>
  <text x="290" y="156" class="s">Beneficiaries + shares</text>

  <text x="520" y="108" class="num">STEP 3</text>
  <text x="520" y="134" class="h">Deposit</text>
  <text x="520" y="156" class="s">FLR, FXRP or USDT</text>

  <text x="750" y="108" class="num">STEP 4</text>
  <text x="750" y="134" class="h">Check in</text>
  <text x="750" y="156" class="s">Reset the timer</text>

  <!-- Step arrows -->
  <path d="M232 128 H266" stroke="#ff6a2c" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M462 128 H496" stroke="#ff6a2c" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M692 128 H726" stroke="#ff6a2c" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Deposit -> contract -->
  <path d="M595 178 V252" stroke="#ff6a2c" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="607" y="220" class="lbl">funds move into the contract</text>

  <!-- Check-in -> contract -->
  <path d="M825 178 V276 H724" stroke="#ff6a2c" stroke-width="2.5" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/>
  <text x="837" y="230" class="lbl">check-in tx</text>

  <!-- Contract -->
  <rect x="240" y="254" width="480" height="44" rx="14" fill="url(#g)"/>
  <text x="480" y="282" text-anchor="middle" class="h" style="fill:#140a04">Legacy Vault V2 smart contract (Flare Mainnet)</text>

  <!-- Contract -> branches -->
  <path d="M360 300 V352" stroke="#8a8a93" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <path d="M600 300 V352" stroke="#8a8a93" stroke-width="2" fill="none" marker-end="url(#m)"/>
  <text x="372" y="330" class="lbl">deadline not reached</text>
  <text x="612" y="330" class="lbl">deadline missed</text>

  <!-- Outcome boxes -->
  <rect class="box" x="80"  y="356" width="360" height="130" rx="14" style="stroke:#2c2c33"/>
  <rect class="box" x="520" y="356" width="360" height="130" rx="14" style="stroke:#ff6a2c"/>

  <text x="104" y="388" class="num">OWNER ACTIVE</text>
  <text x="104" y="416" class="h">You stay in control</text>
  <text x="104" y="440" class="s">Check in, update beneficiaries,</text>
  <text x="104" y="460" class="s">deposit more or withdraw any time.</text>

  <text x="544" y="388" class="num">CHECK-IN MISSED</text>
  <text x="544" y="416" class="h">Beneficiaries claim</text>
  <text x="544" y="440" class="s">Each beneficiary enters the owner's address</text>
  <text x="544" y="460" class="s">on the Claim tab and claims their share.</text>

  <text x="480" y="530" text-anchor="middle" class="lbl">Non-custodial: no Flare Vault account, no keys held, gas is the only cost.</text>
</svg>
